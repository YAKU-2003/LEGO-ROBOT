# MQTT broker for LunchLock (laptop <-> UNO Q over Wi-Fi). latch_link.py starts it automatically;
# to run it by hand:  "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto.conf -v
listener 1883 0.0.0.0
allow_anonymous true
# Forward each small message immediately (no Nagle bundling) - lower lag.
set_tcp_nodelay true
