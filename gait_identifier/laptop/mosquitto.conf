# MQTT broker for the UNO Q gait wearable. Lets the board (another device on the Wi-Fi)
# connect to this laptop. record.py / live.py start it automatically; to run it by hand:
#   "C:\Program Files\mosquitto\mosquitto.exe" -c gait_identifier\laptop\mosquitto.conf -v
listener 1883 0.0.0.0
allow_anonymous true
# Forward each small IMU message immediately (no Nagle bundling) -- lower lag.
set_tcp_nodelay true
